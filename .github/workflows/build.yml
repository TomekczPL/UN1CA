name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'sixteen'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [b0s, g0s, r0s, o1s]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh

      - name: Upload ROM to gofile.io
        if: success()
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: |
          set -uo pipefail
          # Resolve the build's real OUT_DIR (buildenv sets OUT_DIR=$SRC_DIR/out)
          set +u; source ./buildenv.sh ${{ matrix.target }} >/dev/null 2>&1 || true; set -u
          mapfile -t zips < <(find "${OUT_DIR:-out}" "$GITHUB_WORKSPACE" -name 'UN1CA_*.zip' -type f 2>/dev/null | sort -u)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ROM zip found. Diagnostics:"
            echo "OUT_DIR=${OUT_DIR:-<unset>} ; PWD=$PWD"
            ls -la "${OUT_DIR:-out}" 2>/dev/null || echo "(no out dir)"
            echo "--- all .zip under workspace ---"
            find "$GITHUB_WORKSPACE" -name '*.zip' -type f 2>/dev/null | head -50
            exit 1
          fi
          server="$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')"
          echo "Using gofile server: $server"
          auth=()
          if [ -n "${GOFILE_TOKEN:-}" ]; then
            auth=(-H "Authorization: Bearer $GOFILE_TOKEN")
          fi
          echo "### 📦 gofile.io uploads (${{ matrix.target }})" >> "$GITHUB_STEP_SUMMARY"
          for z in "${zips[@]}"; do
            echo "Uploading $(basename "$z") ..."
            resp="$(curl -s "${auth[@]}" -F "file=@$z" "https://${server}.gofile.io/contents/uploadfile")"
            link="$(echo "$resp" | jq -r '.data.downloadPage // empty')"
            if [ -z "$link" ]; then
              echo "Upload failed. Response: $resp"
              exit 1
            fi
            echo "✅ $(basename "$z") -> $link"
            echo "- [$(basename "$z")]($link)" >> "$GITHUB_STEP_SUMMARY"
          done
